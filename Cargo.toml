[package]
name = "maula"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
fontdue = "0.9.5"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
softbuffer = "0.4.8"
toml = "1.1.8"
unicode-width = "0.2.3"
winit = "0.30.13"

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
embed-resource = "3.0.12"

[profile.dev]
opt-level = 3 # our own pixel loops are the hot path: unoptimized they are ~10x slower
